# 맥 앱(.dmg) 만들기: 앱 코드가 바뀐 main에 올리면 만들어 시험하고(Artifacts에 30일),
# v로 시작하는 태그를 올리면 릴리스에 붙인다. Actions 탭에서 직접 돌릴 수도 있다.
# 서명·공증 없이 만든다(애드혹 서명). 처음 열 때 '그래도 열기'가 필요하다 (README 참고).
name: 맥 앱

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "backend/scribe/**"
      - "backend/requirements*.txt"
      - "frontend/src/**"
      - "frontend/package*.json"
      - "launcher/**"
      - ".github/workflows/mac-app.yml"

permissions:
  contents: write

concurrency:
  group: mac-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        shell: bash  # -eo pipefail
    env:
      APP: launcher/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/회의 노트.app
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            launcher/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: 회의 노트 화면
        working-directory: frontend
        run: npm ci && npm run build

      - name: 앱에 넣을 것 모으기 (서버 코드, 화면, uv)
        run: launcher/scripts/prepare.sh aarch64-apple-darwin

      - name: 실행기 시험
        working-directory: launcher/src-tauri
        run: cargo test

      - name: 앱 만들기
        working-directory: launcher
        run: |
          npm ci
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: 만든 앱으로 설치·서버 켜기 시험 (모델은 받지 않음)
        env:
          SCRIBE_LIVE_ENGINE: mock
          SCRIBE_FINAL_ENGINE: mock
          SCRIBE_DIARIZER: mock
        run: |
          codesign --verify --deep --verbose=2 "$APP"
          bin="$APP/Contents/MacOS/meeting-scribe"
          res="$APP/Contents/Resources"
          support="$RUNNER_TEMP/support"
          "$bin" --headless install --support "$support" --resources "$res" --set "data_dir=$RUNNER_TEMP/data" | tee "$RUNNER_TEMP/install.jsonl"
          "$bin" --headless serve --support "$support" --resources "$res"
          "$bin" --headless doctor --support "$support" --resources "$res"
          # 서명된 앱 안에 아무것도 쓰지 않았는지 (__pycache__ 등)
          codesign --verify --deep --strict "$APP"

      - name: 파일 이름 정리
        run: |
          v=$(node -p "require('./launcher/src-tauri/tauri.conf.json').version")
          mkdir -p out
          cp launcher/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg "out/MeetingScribe_${v}_mac-arm64.dmg"
          du -h out/*.dmg

      - uses: actions/upload-artifact@v6
        with:
          name: MeetingScribe-mac-arm64
          path: out/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: 릴리스에 올리기
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          맥북 안에서만 돌아가는 회의 기록 앱이에요.

          - 회의 소리가 1~2초 안에 글자로 올라오고, 틀린 글자는 그 자리에서 고쳐요.
          - 문장 위에 메모·댓글을 달고, 회의가 끝나면 전사 기록과 회의록 문서가 바로 나와요.
          - 녹음과 받아쓰기는 모두 이 맥 안에서만 돌아가요. 요약은 내 Claude 구독으로 해요.

          ## 설치
          1. 아래 `MeetingScribe_…_mac-arm64.dmg`를 받아 열고, **회의 노트**를 응용 프로그램 폴더로 끌어다 놓아요.
          2. 응용 프로그램 폴더에서 회의 노트를 열어요. "열 수 없습니다"가 뜨면 **시스템 설정 → 개인정보 보호 및 보안** 맨 아래에서 **그래도 열기**를 눌러요 (처음 한 번).
             버튼이 보이지 않으면 터미널에서 `xattr -dr com.apple.quarantine "/Applications/회의 노트.app"`를 한 번 실행해요.
          3. 설치 도우미가 이 맥의 메모리에 맞는 받아쓰기 모델을 골라 둬요. 저장 위치, 화자 구분 토큰(선택), Claude 데스크톱 연결을 정하면 파이썬·패키지·모델을 받아요. 처음 한 번, 10분 안팎이에요.
          4. **회의 노트 열기**를 누르면 브라우저에서 회의 화면이 열려요. 앱은 메뉴 막대에 남아 있어요.

          ## 필요한 것
          - Apple Silicon(M1 이상) 맥, macOS 13 이상
          - 남은 공간 약 8GB (메모리 16GB 이상 맥의 기본 모델과 패키지 약 6GB + 여유)

          ## 지우려면
          앱을 휴지통으로 옮기고, 필요하면 아래 폴더도 지워요. 회의 기록은 지우기 전에 앱의 설정 → 전체 백업 내려받기로 챙겨 두세요.
          - 파이썬·패키지·설정: `~/Library/Application Support/com.meetingscribe.app`
          - 받아쓰기 모델: `~/.cache/huggingface`
          - 회의: `~/MeetingScribe` (설치할 때 고른 위치)

          ## 알아 둘 것
          - Apple 개발자 서명·공증 없이 만든 앱이라 처음 한 번 "그래도 열기"가 필요해요.
          - 실제 맥에서 받아쓰기 속도와 정확도는 [맥 점검표](https://github.com/jhkim0602/meeting-scribe/blob/main/docs/MAC_CHECKLIST.md)로 확인해 주세요.
          - 녹음 동의는 참석자에게 꼭 받아 주세요.
          EOF
          gh release create "$GITHUB_REF_NAME" out/*.dmg --title "회의 노트 $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" \
            || gh release upload "$GITHUB_REF_NAME" out/*.dmg --clobber
