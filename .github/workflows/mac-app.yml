# 맥 앱(.dmg + 자동 업데이트 파일) 만들기: 앱 코드가 바뀐 main에 올리면 만들어 시험하고(Artifacts에 30일),
# v로 시작하는 태그는 release.yml이 이 작업을 불러 릴리스에 붙인다. Actions 탭에서 직접 돌릴 수도 있다.
# 서명·공증 없이 만든다(애드혹 서명). 처음 열 때 '그래도 열기'가 필요하다 (README 참고).
name: 맥 앱

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "backend/scribe/**"
      - "backend/requirements*.txt"
      - "frontend/src/**"
      - "frontend/package*.json"
      - "launcher/**"
      - "claude/skills/**"
      - ".github/workflows/mac-app.yml"

permissions:
  contents: write

concurrency:
  group: mac-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        shell: bash  # -eo pipefail
    env:
      APP: launcher/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/회의 노트.app
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            launcher/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: 회의 노트 화면
        working-directory: frontend
        run: npm ci && npm run build

      - name: 앱에 넣을 것 모으기 (서버 코드, 화면, uv)
        run: launcher/scripts/prepare.sh aarch64-apple-darwin

      - name: 실행기 시험
        working-directory: launcher/src-tauri
        run: cargo test

      - name: 앱 만들기
        working-directory: launcher
        env:
          # 자동 업데이트 파일 서명 (공개 키는 tauri.conf.json의 plugins.updater.pubkey)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          npm ci
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: 만든 앱으로 설치·서버 켜기 시험 (모델은 받지 않음)
        env:
          SCRIBE_LIVE_ENGINE: mock
          SCRIBE_FINAL_ENGINE: mock
          SCRIBE_DIARIZER: mock
        run: |
          codesign --verify --deep --verbose=2 "$APP"
          bin="$APP/Contents/MacOS/meeting-scribe"
          res="$APP/Contents/Resources"
          support="$RUNNER_TEMP/support"
          "$bin" --headless install --support "$support" --resources "$res" --set "data_dir=$RUNNER_TEMP/data" | tee "$RUNNER_TEMP/install.jsonl"
          "$bin" --headless serve --support "$support" --resources "$res"
          "$bin" --headless doctor --support "$support" --resources "$res"
          # 서명된 앱 안에 아무것도 쓰지 않았는지 (__pycache__ 등)
          codesign --verify --deep --strict "$APP"

      - name: 파일 이름 정리
        run: |
          v=$(node -p "require('./launcher/src-tauri/tauri.conf.json').version")
          mkdir -p out
          b=launcher/src-tauri/target/aarch64-apple-darwin/release/bundle
          cp $b/dmg/*.dmg "out/MeetingScribe_${v}_mac-arm64.dmg"
          # 자동 업데이트용: 앱 묶음과 서명
          cp $b/macos/*.app.tar.gz "out/MeetingScribe_${v}_mac-arm64.app.tar.gz"
          cp $b/macos/*.app.tar.gz.sig "out/MeetingScribe_${v}_mac-arm64.app.tar.gz.sig"
          du -h out/*

      - uses: actions/upload-artifact@v6
        with:
          name: MeetingScribe-mac-arm64
          path: out/*
          if-no-files-found: error
          retention-days: 30
