# 윈도우 앱(설치 파일 .exe + 자동 업데이트 서명) 만들기: 앱 코드가 바뀐 main에 올리면 만들어 시험하고,
# v로 시작하는 태그는 release.yml이 이 작업을 불러 릴리스에 붙인다.
# Actions 탭에서 직접 돌리면 Artifacts에만 올린다(30일). 서명 없이 만든다 (처음 열 때 SmartScreen 경고).
name: 윈도우 앱

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "backend/scribe/**"
      - "backend/requirements*.txt"
      - "frontend/src/**"
      - "frontend/package*.json"
      - "launcher/**"
      - "claude/skills/**"
      - ".github/workflows/windows-app.yml"

permissions:
  contents: write

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            launcher/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: 회의 노트 화면
        working-directory: frontend
        run: npm ci && npm run build

      - name: 앱에 넣을 것 모으기 (서버 코드, 화면, uv)
        run: launcher/scripts/prepare.sh x86_64-pc-windows-msvc

      - name: 실행기 시험
        working-directory: launcher/src-tauri
        run: cargo test

      - name: 앱 만들기
        working-directory: launcher
        env:
          # 자동 업데이트 파일 서명 (공개 키는 tauri.conf.json의 plugins.updater.pubkey)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          npm ci
          npx tauri build --bundles nsis

      - name: 만든 앱으로 설치·서버 켜기 시험 (모델은 받지 않음)
        env:
          SCRIBE_LIVE_ENGINE: mock
          SCRIBE_FINAL_ENGINE: mock
          SCRIBE_DIARIZER: mock
        run: |
          bin=launcher/src-tauri/target/release/meeting-scribe.exe
          res=launcher/src-tauri/resources  # 설치 파일에 들어가는 것과 같은 폴더
          # 한글·띄어쓰기가 든 경로에서도 (예: 윈도우 사용자 이름이 한글일 때)
          support="$RUNNER_TEMP/한글 경로/support"
          "$bin" --headless install --support "$support" --resources "$res" --set "data_dir=$RUNNER_TEMP/한글 경로/회의 기록" | tee "$RUNNER_TEMP/install.jsonl"
          "$bin" --headless serve --support "$support" --resources "$res"
          "$bin" --headless doctor --support "$support" --resources "$res"

      - name: 파일 이름 정리
        run: |
          v=$(node -p "require('./launcher/src-tauri/tauri.conf.json').version")
          mkdir -p out
          cp launcher/src-tauri/target/release/bundle/nsis/*.exe "out/MeetingScribe_${v}_windows-x64-setup.exe"
          # 자동 업데이트용 서명 (설치 파일을 그대로 받아 조용히 덮어 설치한다)
          cp launcher/src-tauri/target/release/bundle/nsis/*.exe.sig "out/MeetingScribe_${v}_windows-x64-setup.exe.sig"
          du -h out/*

      - uses: actions/upload-artifact@v6
        with:
          name: MeetingScribe-windows-x64
          path: out/*
          if-no-files-found: error
          retention-days: 30
