# 윈도우 앱(설치 파일 .exe) 만들기: win-v로 시작하는 태그를 올리면 사전 릴리스(테스트용)에 붙인다.
# Actions 탭에서 직접 돌리면 Artifacts에만 올린다(30일). 서명 없이 만든다 (처음 열 때 SmartScreen 경고).
name: 윈도우 앱

on:
  workflow_dispatch:
  push:
    tags: ["win-v*"]

permissions:
  contents: write

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            launcher/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: 회의 노트 화면
        working-directory: frontend
        run: npm ci && npm run build

      - name: 앱에 넣을 것 모으기 (서버 코드, 화면, uv)
        run: launcher/scripts/prepare.sh x86_64-pc-windows-msvc

      - name: 실행기 시험
        working-directory: launcher/src-tauri
        run: cargo test

      - name: 앱 만들기
        working-directory: launcher
        run: |
          npm ci
          npx tauri build --bundles nsis

      - name: 만든 앱으로 설치·서버 켜기 시험 (모델은 받지 않음)
        env:
          SCRIBE_LIVE_ENGINE: mock
          SCRIBE_FINAL_ENGINE: mock
          SCRIBE_DIARIZER: mock
        run: |
          bin=launcher/src-tauri/target/release/meeting-scribe.exe
          res=launcher/src-tauri/resources  # 설치 파일에 들어가는 것과 같은 폴더
          support="$RUNNER_TEMP/support"
          "$bin" --headless install --support "$support" --resources "$res" --set "data_dir=$RUNNER_TEMP/data" | tee "$RUNNER_TEMP/install.jsonl"
          "$bin" --headless serve --support "$support" --resources "$res"
          "$bin" --headless doctor --support "$support" --resources "$res"

      - name: 파일 이름 정리
        run: |
          v=$(node -p "require('./launcher/src-tauri/tauri.conf.json').version")
          mkdir -p out
          cp launcher/src-tauri/target/release/bundle/nsis/*.exe "out/MeetingScribe_${v}_windows-x64-setup.exe"
          du -h out/*.exe

      - uses: actions/upload-artifact@v6
        with:
          name: MeetingScribe-windows-x64
          path: out/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: 사전 릴리스(테스트용)에 올리기
        if: startsWith(github.ref, 'refs/tags/win-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          **테스트 중인 윈도우 버전이에요.** 실제 윈도우 PC에서 설치·녹음까지 확인한 뒤 정식으로 바꿀 예정이에요.

          ## 설치
          1. 아래 `MeetingScribe_…_windows-x64-setup.exe`를 받아 실행해요.
             "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행**을 눌러요 (서명 없는 앱이라 처음 한 번).
          2. 설치 도우미가 파이썬·패키지·받아쓰기 모델을 받아요. 처음 한 번, 10~20분이에요.
          3. **회의 노트 열기**를 누르면 브라우저에서 회의 화면이 열려요. 앱은 작업 표시줄 오른쪽 아이콘에 남아 있어요.

          ## 받아쓰기
          - 그래픽 카드 없이 CPU로 돌아가요 (faster-whisper).
          - 기본값: 실시간 **Whisper small**, 녹음 후 정리 **Whisper large-v3 turbo**
          - 회의 중에는 전원을 연결해 주세요. 배터리로 쓰면 글자가 늦게 올라와요.

          ## 필요한 것
          - 64비트 Windows 10/11, 메모리 8GB 이상 (16GB 이상 권장)
          - 남은 공간 약 6GB

          ## 지우려면
          설정 → 앱에서 회의 노트를 제거하고, 필요하면 아래 폴더도 지워요.
          - 파이썬·패키지·설정: `%APPDATA%\com.meetingscribe.app`
          - 받아쓰기 모델: `%USERPROFILE%\.cache\huggingface`
          - 회의: `%USERPROFILE%\MeetingScribe` (설치할 때 고른 위치)
          EOF
          gh release create "$GITHUB_REF_NAME" out/*.exe --prerelease --title "회의 노트 윈도우 테스트 ${GITHUB_REF_NAME#win-}" --notes-file "$RUNNER_TEMP/notes.md" \
            || gh release upload "$GITHUB_REF_NAME" out/*.exe --clobber
