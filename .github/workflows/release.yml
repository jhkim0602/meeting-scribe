# 릴리스: v로 시작하는 태그를 올리면 맥·윈도우 앱을 함께 만들어 릴리스 하나에 올린다.
# latest.json은 설치된 앱이 새 버전을 확인하는 곳이다 (tauri.conf.json의 plugins.updater.endpoints).
name: 릴리스

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac:
    uses: ./.github/workflows/mac-app.yml
    secrets: inherit

  windows:
    uses: ./.github/workflows/windows-app.yml
    secrets: inherit

  publish:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: out
          merge-multiple: true

      - name: 자동 업데이트 목록 (latest.json)
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import datetime, json, os, pathlib
          tag, repo = os.environ["TAG"], os.environ["REPO"]
          out = pathlib.Path("out")
          base = f"https://github.com/{repo}/releases/download/{tag}"
          files = {
              "darwin-aarch64": next(out.glob("*_mac-arm64.app.tar.gz")),
              "windows-x86_64": next(out.glob("*_windows-x64-setup.exe")),
          }
          doc = {
              "version": tag.lstrip("v"),
              "notes": f"회의 노트 {tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  key: {"signature": pathlib.Path(f"{f}.sig").read_text().strip(), "url": f"{base}/{f.name}"}
                  for key, f in files.items()
              },
          }
          (out / "latest.json").write_text(json.dumps(doc, ensure_ascii=False, indent=2))
          print(json.dumps(doc, ensure_ascii=False, indent=2))
          EOF
          ls -la out

      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          cat > notes.md <<EOF
          노트북 안에서만 돌아가는 회의 기록 앱이에요. 녹음과 받아쓰기는 모두 내 컴퓨터 안에서만 돌아가요.

          ## 내려받기
          | 기기 | 파일 |
          |---|---|
          | 맥 (Apple Silicon M1 이상, macOS 13 이상) | \`MeetingScribe_${v}_mac-arm64.dmg\` |
          | 윈도우 10/11 (64비트) · 테스트 중 | \`MeetingScribe_${v}_windows-x64-setup.exe\` |

          이미 설치했다면 앱이 새 버전을 알려 줘요 (v0.1.2부터). **지금 업데이트**를 누르면 받고, 바꾸고, 다시 켜요. 회의 기록과 받은 모델은 그대로예요.
          \`.app.tar.gz\`, \`.sig\`, \`latest.json\`은 자동 업데이트용이라 받지 않아도 돼요.

          ## 처음 설치
          **맥:** \`.dmg\`를 열고 **회의 노트**를 응용 프로그램 폴더로 끌어다 놓아요. "열 수 없습니다"가 뜨면 **시스템 설정 → 개인정보 보호 및 보안**에서 **그래도 열기** (처음 한 번).

          **윈도우:** \`.exe\`를 실행해요. "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행** (처음 한 번). 받아쓰기는 CPU로 돌아가요 (기본: 실시간 Whisper small, 녹음 후 정리 Whisper large-v3 turbo).

          설치 도우미가 파이썬·패키지·받아쓰기 모델을 받아요 (처음 한 번, 10~20분). 개발자 서명 없이 만든 앱이에요. 녹음 동의는 참석자에게 꼭 받아 주세요.
          EOF
          gh release create "$TAG" out/*.dmg out/*.exe out/*.app.tar.gz out/*.sig out/latest.json \
            --repo "${{ github.repository }}" --title "회의 노트 $TAG" --notes-file notes.md
