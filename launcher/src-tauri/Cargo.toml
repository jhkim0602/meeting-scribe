[package]
name = "meeting-scribe"
version = "0.1.3"
description = "회의 노트 설치·실행 도우미"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "=2.7.0"
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-single-instance = "=2.5.1"
tauri-plugin-updater = "=2.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
